# Structured feature flags captured during curation, for future BERT/model-training feature
# engineering. This is a living checklist, not a fixed schema -- add/remove entries freely as
# it becomes clearer what actually helps (see AGENTS.md and ROADMAP.md's Curation app section).
# Each flag is fixed-vocabulary (checkbox/dropdown in the app), never free text -- notes already
# covers free text.

features:
  - key: close_negative_reason
    label: "If negative: why? (only shown when decision = negative)"
    type: select
    options:
      - theoretical-method-only
      - generic-nlp-extraction-only
      - wrong-domain-non-bio
      - review-mentions-ml-only
      - other
    shown_when_decision: negative
