# Global pipeline settings shared across CLI steps.

curation:
  events_log: data/processed/curation_events.csv
  conflict_resolutions: data/processed/conflict_resolutions.csv
  backup_suffix: "_backup"
  default_curator: gavinfarrell

keywords:
  candidates: data/processed/keyword_lexicon_candidates.csv
  lexicon: data/processed/keyword_lexicon.csv
  exclusionary_lexicon: data/processed/keyword_lexicon_exclusionary.csv
  seed_terms: /home/gavinfarrell/PhD_Code/MLit-Triage-Nextflow/categorized_terms.csv
  # Tier 2 -- curated_terms.py's additions, kept separate from the human-curated lexicon/
  # exclusionary_lexicon above (see keywords.seed-additional-terms).
  added_positive_terms: data/processed/keyword_lexicon_added_positive.csv
  added_negative_terms: data/processed/keyword_lexicon_added_negative.csv
  # Tier 3 -- tier 1 + tier 2 combined and cleaned (see keywords.suggest-final-lexicon /
  # keywords/lexicon_cleanup.py). Never auto-promoted to lexicon/exclusionary_lexicon above.
  suggested_lexicon: data/processed/keyword_lexicon_suggested_final.csv
  suggested_exclusionary_lexicon: data/processed/keyword_lexicon_exclusionary_suggested_final.csv
  suggested_cleanup_log: data/processed/keyword_lexicon_cleanup_log.csv

# Step 8 (Keyword Review) curation checkpoint -- see curate/term_review_state.py. Every term gets
# one of three final decisions -- positive / negative (exclusionary) / irrelevant -- regardless of
# which candidate pile it was surfaced from, so a term can be reclassified across piles, and a
# curator can manually add a term that was never auto-extracted at all.
keyword_review:
  events_log: data/processed/keyword_review_events.csv
  irrelevant_terms: data/processed/keyword_lexicon_irrelevant.csv
  default_min_discriminative_score: 0.0
  default_min_document_frequency: 1
  default_max_discriminative_score: -0.001
  default_max_terms_per_session: 500

budget:
  # Hard cap (GBP) on paid cloud/API spend across the whole project (Phase 4+). Any code path
  # that calls a paid API or provisions paid cloud/TPU compute must estimate and log cost here
  # before running, and must not proceed past this cap without explicit confirmation.
  total_cap_gbp: 100
  spend_log: data/processed/compute_spend_log.csv

fulltext:
  link_mode: none   # none | symlink | copy -- see AGENTS.md; default never copies PDFs into the repo
  local_dir: data/fulltext
